<!--
  METHOD 336.d — compact closing card (show_widget, ~2 k tokens). Rule: method-core.md → "Closing by
  session type" → "Inline card". Fill the placeholders; never redesign it. Delete unused tiles/buttons
  (1–3 tiles, 1–2 buttons). No emoji: Tabler icons (ti ti-*) only; theme CSS variables only.
  {sr_summary}   one sentence for screen readers: what was done, where it leaves the work
  {project}      app name            {object}  the object, in outcome terms
  {outcome}      one line, operator language
  {state_word}   CODÉ · ATTERRI · DÉPLOYÉ · PROUVÉ · en cours · bloqué
  {state_tone}   success (ATTERRI/DÉPLOYÉ/PROUVÉ) · warning (CODÉ, en cours) · danger (bloqué)
  {tile_icon_n}  Tabler name, e.g. git-commit · rocket · file-text · test-pipe · photo
  {tile_text_n}  one Fait bullet, the object named
  {proof_url_n}  its clickable proof (PR, commit, served URL, file)   {proof_label_n} e.g. a1b2c3d
  {fate_icon}    archive · message-question · flask · key · hourglass · repeat
  {fate_verb}    Archive · Réponds · Teste · Agis · Attends · Continue ici
  {fate_object}  Suite bullet 1, the object
  {btn_prompt_n} the prompt the button sends   {btn_label_n} its label
-->
<h2 class="sr-only">{sr_summary}</h2>
<style>
.cc{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1.5rem 1.75rem}
.cc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cc .t{font-weight:500;font-size:15px;margin:0}
.cc .s{font-size:13px;color:var(--text-secondary);margin:6px 0 0;line-height:1.5}
.cc .b{font-size:12px;padding:3px 10px;border-radius:var(--radius);white-space:nowrap}
.cc .k{font-size:12px;color:var(--text-muted);margin:24px 0 10px}
.cc .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.cc .m{background:var(--surface-1);border-radius:var(--radius);padding:14px 16px;font-size:13px;line-height:1.55}
.cc .m a{display:block;margin-top:8px;font-size:12px;color:var(--text-accent)}
.cc .n{font-size:13px;margin:0 0 16px;line-height:1.55}
.cc .row{display:flex;flex-wrap:wrap;gap:10px}
</style>
<div class="cc">
  <div class="h">
    <div><p class="t">{project} · {object}</p><p class="s">{outcome}</p></div>
    <span class="b" style="background:var(--bg-{state_tone});color:var(--text-{state_tone})">{state_word}</span>
  </div>
  <p class="k">Fait</p>
  <div class="g">
    <div class="m"><i class="ti ti-{tile_icon_1}" aria-hidden="true"></i> {tile_text_1}<a href="{proof_url_1}" target="_blank">{proof_label_1} ↗</a></div>
    <div class="m"><i class="ti ti-{tile_icon_2}" aria-hidden="true"></i> {tile_text_2}<a href="{proof_url_2}" target="_blank">{proof_label_2} ↗</a></div>
    <div class="m"><i class="ti ti-{tile_icon_3}" aria-hidden="true"></i> {tile_text_3}<a href="{proof_url_3}" target="_blank">{proof_label_3} ↗</a></div>
  </div>
  <p class="k">Suite</p>
  <p class="n"><i class="ti ti-{fate_icon}" aria-hidden="true"></i> <b style="font-weight:500">{fate_verb}</b> : {fate_object}</p>
  <div class="row">
    <button onclick="sendPrompt('{btn_prompt_1}')">{btn_label_1} ↗</button>
    <button onclick="sendPrompt('{btn_prompt_2}')">{btn_label_2} ↗</button>
  </div>
</div>
