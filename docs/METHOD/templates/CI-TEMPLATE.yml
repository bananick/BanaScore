#
# METHOD CI Gate Template — v307.b (inert)
#
# Copy this file to your app's `.github/workflows/ci.yml`
# and customize the steps as needed.
#
# This template enforces the METHOD CI Gate:
# - Lint (ESLint)
# - Typecheck (TypeScript)
# - Unit + Integration tests (Vitest/Jest)
# - Production build
# - E2E tests (Playwright) — optional until first CUJ spec exists
#
# See: docs/METHOD/method-core.md § CI Gate
# See: docs/METHOD/tests-method.md § E2E Tests

name: CI Gate

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Quality Gate (required — blocks merge to main)
  # ──────────────────────────────────────────────
  quality:
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Lint ──
      - name: Lint
        run: npm run lint

      # ── Typecheck ──
      - name: TypeScript check
        run: npx tsc --noEmit

      # ── Unit + Integration tests ──
      - name: Tests
        run: npm test -- --passWithNoTests --reporter=verbose

      # ── Production build ──
      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # E2E Tests (add when first Playwright spec exists)
  # ──────────────────────────────────────────────
  # Uncomment this job when you have tests/e2e/*.spec.ts files:
  #
  # e2e:
  #   name: E2E Tests (Playwright)
